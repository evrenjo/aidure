# aikit docs pages: 문서 사이트(docs-site/)를 GitLab Pages 로 올린다. docs-site/ 는 aikit docs build 로 만들어 커밋한 것을 그대로 쓴다
# 켜고 끄기: aikit docs pages on | off (끄면 docs-site/ 를 커밋하지 않아 이 작업이 돌지 않는다). GitLab 서버에 Pages 기능과 러너가 있어야 한다
pages:
  stage: deploy
  image: alpine:3
  script:
    - test -f docs-site/assets/site.json || { echo "docs-site/ 가 없습니다. aikit docs build 로 만들어 커밋하세요"; exit 1; }
    - rm -rf public && cp -r docs-site public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      exists:
        - docs-site/assets/site.json
