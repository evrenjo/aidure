# 공개판 CI: push · PR 마다 test. v* 태그면 npm 발행 (신뢰 게시: 토큰 없이 OIDC, npmjs.com 패키지 설정에 이 저장소 · ci.yml 등록). main push 면 문서 사이트(GitHub Pages)
# 공급망: 액션은 태그가 아니라 커밋 SHA 로 고정한다 (태그 바꿔치기 대비, 뒤 주석이 그 버전). 의존 설치는 --ignore-scripts (설치 스크립트가 토큰을 훔치는 웜 대비)
# 올릴 때: gh api repos/actions/<이름>/git/ref/tags/<태그> 로 SHA 를 확인해 SHA 와 주석을 같이 바꾼다
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm ci --ignore-scripts   # 시험은 devDependencies(esbuild · playwright-core)의 설치 스크립트가 필요 없다
      - run: npm test
        env:
          AIDURE_NO_UPDATE_CHECK: '1'
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g --ignore-scripts npm@11.21.0   # 신뢰 게시(OIDC)는 npm 11.5.1 이상. 범위가 아닌 정확한 버전으로
      # 발행에는 의존 설치가 필요 없다 (빌드 단계 없음). OIDC 토큰을 받을 수 있는 이 작업에서는 남의 설치 스크립트를 돌리지 않는다
      - run: cp npm-readme.md README.md   # npm 쪽 소개는 짧은 판 (설치 · 빠른 시작 · 링크). GitHub README 는 그대로
      - run: npm publish --access public   # 신뢰 게시면 출처 증명(provenance)도 자동
  pages:
    # 문서 사이트는 main push 때 (github-pages 환경이 main 만 허용). Pages 를 켠 저장소에서만 (Settings > Pages = GitHub Actions 뒤 저장소 변수 PAGES=on)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.PAGES == 'on'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs-site
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
