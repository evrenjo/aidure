# 공개판 CI: push · PR 마다 test. v* 태그면 npm 발행 (신뢰 게시: 토큰 없이 OIDC, npmjs.com 패키지 설정에 이 저장소 · ci.yml 등록) 과 문서 사이트(GitHub Pages)
name: ci
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
        env:
          AIDURE_NO_UPDATE_CHECK: '1'
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1   # 신뢰 게시(OIDC)는 npm 11.5.1 이상
      - run: npm ci
      - run: npm publish --access public   # 신뢰 게시면 출처 증명(provenance)도 자동
  pages:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - uses: actions/deploy-pages@v4
